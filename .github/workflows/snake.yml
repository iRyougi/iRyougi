name: Contribution Snake

on:
  schedule:
    - cron: "0 16 * * *" # 悉尼时间凌晨 3 点左右
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake (Claude palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#141413&color_dots=#EBE7DF,#F2C9B6,#E8A487,#D97757,#A9462A
            dist/snake-dark.svg?color_snake=#F0EEE6&color_dots=#161B22,#4A2A1F,#7A3B26,#B8552F,#D97757

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
