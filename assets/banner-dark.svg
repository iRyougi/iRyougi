<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">苏幽璃 · iRyougi</title>
  <desc id="d">Claude 配色的动态个人主页横幅：陶土橙色块、虎纹剪纸、旋转的雏菊发饰与飘落的花瓣。</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
    <clipPath id="blob"><path d="M820 0 C 770 70, 860 120, 805 200 C 755 270, 850 330, 800 400 L1200 400 L1200 0 Z"/></clipPath>
    <clipPath id="typed"><rect x="192" y="76" height="26" width="0">
      <animate attributeName="width" begin="0.3s" dur="0.9s" fill="freeze" calcMode="discrete"
        values="0;12;23;34;45;56;70" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"/>
    </rect></clipPath>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif { font-family: "Tiempos Headline", "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif; }
      .sans  { font-family: "Styrene A", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono  { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .fb    { transform-box: fill-box; }

      @keyframes blobIn { from { transform: translateX(440px); } to { transform: none; } }
      @keyframes rise   { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes slideR { from { opacity: 0; transform: translateX(140px); } to { opacity: 1; transform: none; } }
      @keyframes slideL { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: none; } }
      @keyframes pop    { 0% { transform: scale(0) rotate(-120deg); } 70% { transform: scale(1.08) rotate(8deg); } 100% { transform: none; } }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes sway   { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
      @keyframes blink  { 50% { opacity: 0; } }
      @keyframes sweep  { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(560px) skewX(-20deg); } }
      @keyframes glitchA { 0%, 86%, 100% { opacity: 0; transform: none; } 87% { opacity: .9; transform: translate(-6px, 2px); } 89% { opacity: .9; transform: translate(5px, -2px); } 91% { opacity: 0; } }
      @keyframes glitchB { 0%, 87%, 100% { opacity: 0; transform: none; } 88% { opacity: .8; transform: translate(6px, -1px); } 90% { opacity: .8; transform: translate(-4px, 2px); } 92% { opacity: 0; } }
      @keyframes jitter  { 0%, 86%, 92%, 100% { transform: none; } 88% { transform: translateX(2px); } 90% { transform: translateX(-2px); } }

      .blobIn { animation: blobIn 1s cubic-bezier(.2,.8,.2,1) both; }
      .r1 { animation: rise .8s cubic-bezier(.2,.8,.2,1) .2s both; }
      .r2 { animation: rise .8s cubic-bezier(.2,.8,.2,1) .45s both; }
      .r3 { animation: rise .8s cubic-bezier(.2,.8,.2,1) .9s both; }
      .r4 { animation: rise .8s cubic-bezier(.2,.8,.2,1) 1.1s both; }
      .bar { transform-origin: left center; animation: grow .7s cubic-bezier(.2,.8,.2,1) .8s both; }
      .popIn { transform-origin: center; animation: pop 1s cubic-bezier(.2,.8,.2,1) .7s both; }
      .daisy { transform-box: fill-box; transform-origin: center; animation: spin 24s linear 1.7s infinite; }
      .sway  { transform-box: fill-box; transform-origin: top center; animation: sway 6s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .sweep { animation: sweep 6s ease-in-out 1.5s infinite; }
      .gA { animation: glitchA 7s steps(1) 2s infinite; }
      .gB { animation: glitchB 7s steps(1) 2s infinite; }
      .jit { animation: jitter 7s steps(1) 2s infinite; }
      .st0 { animation: slideR .7s cubic-bezier(.2,.8,.2,1) 0.50s both; }
      .st1 { animation: slideR .7s cubic-bezier(.2,.8,.2,1) 0.62s both; }
      .st2 { animation: slideR .7s cubic-bezier(.2,.8,.2,1) 0.74s both; }
      .st3 { animation: slideL .7s cubic-bezier(.2,.8,.2,1) 0.86s both; }
      .st4 { animation: slideL .7s cubic-bezier(.2,.8,.2,1) 0.98s both; }
      .st5 { animation: slideL .7s cubic-bezier(.2,.8,.2,1) 1.10s both; }
      @keyframes fall0 {0% { transform: translate(1010px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(900px,430px) rotate(600deg); opacity: 0; } }.pt0 { animation: fall0 9.0s linear -1.0s infinite; }
      @keyframes fall1 {0% { transform: translate(1080px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(1150px,430px) rotate(600deg); opacity: 0; } }.pt1 { animation: fall1 11.0s linear -4.0s infinite; }
      @keyframes fall2 {0% { transform: translate(960px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(760px,430px) rotate(600deg); opacity: 0; } }.pt2 { animation: fall2 10.0s linear -6.5s infinite; }
      @keyframes fall3 {0% { transform: translate(1120px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(1000px,430px) rotate(600deg); opacity: 0; } }.pt3 { animation: fall3 8.0s linear -2.5s infinite; }
      @keyframes fall4 {0% { transform: translate(900px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(640px,430px) rotate(600deg); opacity: 0; } }.pt4 { animation: fall4 12.0s linear -8.0s infinite; }
      @keyframes fall5 {0% { transform: translate(1040px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(1180px,430px) rotate(600deg); opacity: 0; } }.pt5 { animation: fall5 9.5s linear -5.0s infinite; }
      @keyframes fall6 {0% { transform: translate(840px,-30px) rotate(0deg); opacity: 0; }8% { opacity: .95; }85% { opacity: .9; }100% { transform: translate(560px,430px) rotate(600deg); opacity: 0; } }.pt6 { animation: fall6 13.0s linear -10.0s infinite; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#1F1E1D"/>
    <rect x="28" y="28" width="1144" height="344" rx="16" fill="none" stroke="#3A3936" stroke-width="1.5"/>

    <!-- 陶土橙色块 + 扫光 -->
    <g class="blobIn">
      <path d="M820 0 C 770 70, 860 120, 805 200 C 755 270, 850 330, 800 400 L1200 400 L1200 0 Z" fill="#D97757"/>
      <path d="M860 0 C 830 60, 900 110, 860 190 C 825 260, 905 320, 870 400" fill="none" stroke="#C6613F" stroke-width="3" opacity=".6"/>
      <g clip-path="url(#blob)"><rect class="sweep" x="760" y="-40" width="180" height="480" fill="url(#shine)"/></g>
    </g>

    <!-- 虎纹剪纸 -->
    <g fill="#141413">
      <path class="st0" d="M1200 34 L1068 62 L1200 88 Z"/>
      <path class="st1" d="M1200 128 L1110 146 L1200 160 Z"/>
      <path class="st2" d="M1200 300 L1052 332 L1200 352 Z"/>
      <path class="st3" d="M812 52 L900 74 L822 92 Z"/>
      <path class="st4" d="M800 236 L884 252 L808 270 Z"/>
      <path class="st5" d="M818 344 L912 362 L826 382 Z"/>
    </g>

    <!-- 缎带 + 雏菊 -->
    <g class="fb popIn">
      <g class="sway">
        <path d="M1000 210 L1040 210 L1066 400 L1028 400 Z" fill="#141413"/>
        <path d="M1040 210 L1070 210 L1104 400 L1068 400 Z" fill="#F5E9D8"/>
        <path d="M1070 210 L1092 210 L1134 400 L1106 400 Z" fill="#141413"/>
        <path d="M1032 300 L1112 300 L1116 318 L1036 318 Z" fill="#F5E9D8" opacity=".9"/>
      </g>
      <g class="daisy">
      <g fill="#F5E9D8" stroke="#141413" stroke-width="2.5">
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(0.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(22.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(45.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(67.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(90.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(112.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(135.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(157.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(180.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(202.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(225.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(247.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(270.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(292.5 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(315.0 1040 184)"/>
        <ellipse cx="1040" cy="132" rx="15" ry="52" transform="rotate(337.5 1040 184)"/>
      </g>
      <circle cx="1040" cy="184" r="34" fill="#141413"/>
      <circle cx="1040" cy="184" r="21" fill="#F5E9D8"/>
      <circle cx="1040" cy="184" r="11" fill="#141413"/>
    </g>
    </g>

    <!-- 飘落的花瓣 -->
    <g class="pt0"><ellipse rx="6.0" ry="15.0" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>
    <g class="pt1"><ellipse rx="4.8" ry="12.0" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>
    <g class="pt2"><ellipse rx="5.4" ry="13.5" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>
    <g class="pt3"><ellipse rx="4.2" ry="10.5" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>
    <g class="pt4"><ellipse rx="4.8" ry="12.0" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>
    <g class="pt5"><ellipse rx="3.6" ry="9.0" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>
    <g class="pt6"><ellipse rx="4.2" ry="10.5" fill="#F5E9D8" stroke="#141413" stroke-width="1.6"/></g>

    <!-- 左侧文字 -->
    <g class="r1">
      <text x="72" y="96" class="mono" font-size="17" fill="#87867F">~/iRyougi <tspan fill="#D97757">❯</tspan></text>
      <text x="194" y="96" class="mono" font-size="17" fill="#87867F" clip-path="url(#typed)">whoami</text>
      <text x="262" y="96" class="mono blink" font-size="17" fill="#D97757">▍</text>
    </g>

    <g class="r2">
      <g class="gA"><text x="68" y="196" class="serif" font-size="84" font-weight="600" fill="#D97757">苏幽璃</text></g>
      <g class="gB"><text x="68" y="196" class="serif" font-size="84" font-weight="600" fill="#F0EEE6" opacity=".7">苏幽璃</text></g>
      <g class="jit">
        <text x="68" y="196" class="serif" font-size="84" font-weight="600" fill="#F0EEE6">苏幽璃</text>
        <text x="358" y="196" class="serif" font-size="52" font-style="italic" fill="#D97757">iRyougi</text>
      </g>
    </g>

    <rect class="fb bar" x="72" y="224" width="56" height="4" rx="2" fill="#D97757"/>
    <text class="r3 serif" x="72" y="268" font-size="25" fill="#C2C0B6">无法飞翔的翅膀，也有它存在的意义。</text>

    <g class="r4 sans" font-size="15">
      <rect x="72"  y="300" width="150" height="36" rx="18" fill="#D97757"/>
      <text x="147" y="323" text-anchor="middle" fill="#141413">✳ Slay the Spire 2</text>
      <rect x="234" y="300" width="132" height="36" rx="18" fill="none" stroke="#87867F" stroke-width="1.5"/>
      <text x="300" y="323" text-anchor="middle" fill="#F0EEE6">KAMITSUBAKI</text>
      <rect x="378" y="300" width="146" height="36" rx="18" fill="none" stroke="#87867F" stroke-width="1.5"/>
      <text x="451" y="323" text-anchor="middle" fill="#F0EEE6">Sydney · AU</text>
    </g>
  </g>
</svg>
